version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: "monday"
      time: "08:00"
    cooldown:
      default-days: 7
    groups:
      kotlin:
        patterns: ['org.jetbrains.kotlin*']
      junit:
        patterns: ['org.junit*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: "monday"
      time: "08:00"
    cooldown:
      default-days: 7
