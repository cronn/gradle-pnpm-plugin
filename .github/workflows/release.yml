name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency: ${{ github.workflow }}

jobs:
  publish:
    name: Publish to the Gradle Plugin Portal
    runs-on: ubuntu-latest
    # Holds GRADLE_PUBLISH_KEY and GRADLE_PUBLISH_SECRET, so publishing needs an approved
    # deployment rather than any push that can create a tag.
    environment: release
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6.0.0
        with:
          java-version: '25'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v6.3.0

      - name: Derive the version from the tag
        run: echo "ARTIFACT_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Refuse to publish a snapshot
        run: |
          case "$ARTIFACT_VERSION" in
            *SNAPSHOT*)
              echo "Refusing to publish $ARTIFACT_VERSION to the plugin portal"
              exit 1
              ;;
          esac

      - run: ./gradlew build --stacktrace

      # publishPlugins is not idempotent and the portal rejects re-publishing a version, so the
      # publication is validated before anything is uploaded.
      - name: Validate the publication
        run: ./gradlew publishPlugins --validate-only --stacktrace
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}

      - name: Publish
        run: ./gradlew publishPlugins --stacktrace
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}

      - name: Create the GitHub release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
