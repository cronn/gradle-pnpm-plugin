name: CI

on:
  pull_request:
  merge_group:
  workflow_dispatch:
  # setup-gradle only writes cache entries from the default branch, and neither pull_request nor
  # merge_group runs there. Without this trigger every job starts from a cold Gradle User Home.
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check (${{ matrix.os }}, JDK ${{ matrix.java }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            java: '25'
          # The platform detection, the test stubs and the pnpm distribution are OS specific, so all
          # three are built.
          - os: macos-latest
            java: '25'
          - os: windows-latest
            java: '25'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6.1.0
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin

      # Validates the Gradle wrapper checksums by default.
      - uses: gradle/actions/setup-gradle@v6.4.0

      # The integration tests install the workspace in src/integrationTest/workspace with the real
      # pnpm, which downloads Node.js into its store. Every path is listed for every OS; the ones
      # that do not exist are skipped.
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.local/share/pnpm/store
            ~/Library/pnpm/store
            ~/AppData/Local/pnpm/store
          key: integration-${{ runner.os }}-${{ hashFiles('src/integrationTest/workspace/pnpm-lock.yaml') }}
          restore-keys: integration-${{ runner.os }}-

      - run: ./gradlew build --stacktrace

      - if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: reports-${{ matrix.os }}-jdk${{ matrix.java }}
          path: |
            build/reports/
            build/test-results/
          if-no-files-found: ignore
