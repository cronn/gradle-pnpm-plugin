name: CI

on:
  pull_request:
  merge_group:
  workflow_dispatch:
  # setup-gradle only writes cache entries from the default branch, and neither pull_request nor
  # merge_group runs there. Without this trigger every job starts from a cold Gradle User Home.
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check (${{ matrix.os }}, JDK ${{ matrix.java }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # The lowest supported JDK is the one that catches accidental use of newer JDK APIs in
          # bytecode that claims to target Java 21.
          - os: ubuntu-latest
            java: '21'
          - os: ubuntu-latest
            java: '25'
          # The platform detection and the test stubs are OS specific, so all three are built.
          - os: macos-latest
            java: '25'
          - os: windows-latest
            java: '25'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6.0.0
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin

      # Validates the Gradle wrapper checksums by default.
      - uses: gradle/actions/setup-gradle@v6.3.0

      - run: ./gradlew build --stacktrace

      - if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: reports-${{ matrix.os }}-jdk${{ matrix.java }}
          path: |
            build/reports/
            build/test-results/
          if-no-files-found: ignore

  gradle-compatibility:
    name: Gradle compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6.0.0
        with:
          java-version: '21'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v6.3.0

      # Downloads the named Gradle distributions and runs the TestKit suite against each of them.
      - run: ./gradlew functionalTest -PpnpmTestGradleVersions=9.0.0,9.7.1 --stacktrace

      - if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: reports-gradle-compatibility
          path: |
            build/reports/
            build/test-results/
          if-no-files-found: ignore
