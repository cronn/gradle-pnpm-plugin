name: CI

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check (${{ matrix.os }}, JDK ${{ matrix.java }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The lowest supported JDK is the one that catches accidental use of newer JDK APIs in
          # bytecode that claims to target Java 17.
          - os: ubuntu-latest
            java: '17'
          - os: ubuntu-latest
            java: '21'
          - os: ubuntu-latest
            java: '25'
          # The platform detection and the test stubs are OS specific, so all three are built.
          - os: macos-latest
            java: '25'
          - os: windows-latest
            java: '25'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin

      # Validates the Gradle wrapper checksums by default.
      - uses: gradle/actions/setup-gradle@v5

      - run: ./gradlew build --stacktrace

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ matrix.os }}-jdk${{ matrix.java }}
          path: build/reports/

  gradle-compatibility:
    name: Gradle compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v5

      # Downloads the named Gradle distributions and runs the TestKit suite against each of them.
      - run: ./gradlew functionalTest -PpnpmTestGradleVersions=9.0.0,9.6.1 --stacktrace
